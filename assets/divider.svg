<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="animated divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF0033"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.4" stop-color="#FF0033"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="11" width="1000" height="2" fill="url(#line)"/>

  <g stroke="#FF0033" stroke-opacity="0.45" stroke-width="1">
    <path d="M100 8V16M200 8V16M300 8V16M400 8V16M600 8V16M700 8V16M800 8V16M900 8V16"/>
  </g>

  <rect x="486" y="6" width="28" height="12" fill="none" stroke="#FF0033" stroke-width="1.5">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>

  <circle cy="12" r="10" fill="url(#dot)">
    <animate attributeName="cx" values="-20;1020" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
