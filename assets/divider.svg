<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="28" viewBox="0 0 1000 28" role="img" aria-label="animated gold divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8C766"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#F3D98A"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="13" width="1000" height="1.5" fill="url(#gf)"/>
  <rect x="495" y="9" width="10" height="10" fill="#E8C766" transform="rotate(45 500 14)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="470" y="12.5" width="16" height="2" fill="#E8C766" opacity="0.7"/>
  <rect x="514" y="12.5" width="16" height="2" fill="#E8C766" opacity="0.7"/>
  <circle cy="14" r="11" fill="url(#lamp)">
    <animate attributeName="cx" values="-20;1020" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
