<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-label="animated heartbeat monitor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <filter id="glow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="100" rx="12" fill="#0D0208" stroke="#8B0000" stroke-width="2"/>

  <g font-family="'Courier New',Courier,monospace" font-size="13" fill="#FF6B81">
    <circle cx="26" cy="22" r="5" fill="#FF0033">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
    </circle>
    <text x="40" y="27">LIVE // BUILDING IN PUBLIC</text>
    <text x="974" y="27" text-anchor="end">PULSE: STEADY</text>
  </g>

  <!-- faint full trace -->
  <path d="M20 62H180l12-8 12 8H260l8 6 12-44 14 70 12-48 8 16H520l12-8 12 8H600l8 6 12-44 14 70 12-48 8 16H980"
        fill="none" stroke="#5C0A14" stroke-width="2"/>

  <!-- travelling bright pulse -->
  <path d="M20 62H180l12-8 12 8H260l8 6 12-44 14 70 12-48 8 16H520l12-8 12 8H600l8 6 12-44 14 70 12-48 8 16H980"
        pathLength="100" fill="none" stroke="#FF0033" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="14 86" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="14" to="-86" dur="3s" repeatCount="indefinite"/>
  </path>
</svg>
