  <use href="#t" x="0" fill="#FF0033" opacity="0.85">
    <animate attributeName="x" values="0;-6;6;0;0;9;0" keyTimes="0;0.02;0.04;0.06;0.7;0.72;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
  </use>
  <use href="#t" x="0" fill="#FFFFFF" opacity="0.3">
    <animate attributeName="x" values="0;5;-4;0;0;-8;0" keyTimes="0;0.02;0.04;0.06;0.7;0.72;1" dur="4s" calcMode="discrete" repeatCount="indefinite"/>
  </use>
  <use href="#t" x="0" fill="#FFFFFF" filter="url(#glow)"/>

  <!-- typed subtitle -->
  <g font-family="'Courier New',Courier,monospace" font-size="20" fill="#FF3355">
    <text x="300" y="190" textLength="400" lengthAdjust="spacingAndGlyphs" clip-path="url(#typed)">[ DATA // FINTECH // DEVOPS // GEO-AI ]</text>
  </g>
  <rect x="300" y="171" width="10" height="24" fill="#FF0033">
    <animate attributeName="x" values="300;700;700;300" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
