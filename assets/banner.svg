<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="SANJEV animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0208"/>
      <stop offset="0.55" stop-color="#2A0409"/>
      <stop offset="1" stop-color="#5C0A14"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FF0033" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF0033" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typed">
      <rect x="300" y="166" height="34" width="0">
        <animate attributeName="width" values="0;400;400;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- moving grid -->
  <rect x="-40" y="0" width="1080" height="260" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline -->
  <rect x="0" y="-20" width="1000" height="20" fill="url(#scan)" opacity="0.6">
    <animate attributeName="y" from="-20" to="260" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g fill="none" stroke="#FF0033" stroke-width="3">
    <path d="M20 50V20H50"/>
    <path d="M950 20H980V50"/>
    <path d="M20 210V240H50"/>
    <path d="M950 240H980V210"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- status -->
  <g font-family="'Courier New',Courier,monospace" font-size="14" fill="#FF6B81">
    <circle cx="48" cy="34" r="5" fill="#FF0033">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="39">[ SYSTEM ONLINE ]</text>
    <text x="952" y="39" text-anchor="end">SECURE LINK // ACTIVE</text>
  </g>

  <!-- glitch title (audiowide) -->
