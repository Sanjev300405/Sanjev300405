<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 56" width="1280" height="56" role="img" aria-label="Divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8172F" stop-opacity="0"/><stop offset="1" stop-color="#E8172F"/></linearGradient>
  <linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E8172F"/><stop offset="1" stop-color="#E8172F" stop-opacity="0"/></linearGradient>
  <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  .dl{animation:dash 1.4s linear infinite}
  .dr{animation:dash 1.4s linear infinite reverse}
  .dia{transform-box:fill-box;transform-origin:center;animation:spin 6s ease-in-out infinite}
  .sl{animation:fade 1.8s ease-in-out infinite}
  .sl:nth-of-type(2){animation-delay:.2s}.sl:nth-of-type(3){animation-delay:.4s}
  .sr{animation:fade 1.8s ease-in-out infinite reverse}
  @keyframes dash{to{stroke-dashoffset:-44}}
  @keyframes spin{0%,70%{transform:rotate(45deg)}100%{transform:rotate(405deg)}}
  @keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<!-- lines -->
<rect x="60" y="27" width="470" height="2" fill="url(#l)"/>
<rect x="750" y="27" width="470" height="2" fill="url(#r)"/>
<line class="dl" x1="60" y1="34" x2="530" y2="34" stroke="#FF8A94" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="16 28"/>
<line class="dr" x1="750" y1="34" x2="1220" y2="34" stroke="#FF8A94" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="16 28"/>
<!-- comic slashes -->
<g fill="#E8172F">
  <path class="sl" d="M552 14h10l-12 28h-10z"/><path class="sl" d="M572 14h10l-12 28h-10z"/><path class="sl" d="M592 14h10l-12 28h-10z"/>
  <path class="sr" d="M678 14h10l-12 28h-10z"/><path class="sr" d="M698 14h10l-12 28h-10z"/><path class="sr" d="M718 14h10l-12 28h-10z"/>
</g>
<!-- centre diamond -->
<g filter="url(#g)">
  <rect x="624" y="16" width="32" height="24" transform="translate(0 0)" fill="none"/>
  <rect class="dia" x="626" y="12" width="28" height="28" fill="#E8172F" stroke="#fff" stroke-width="3"/>
</g>
<circle cx="640" cy="28" r="3.5" fill="#fff"/>
</svg>
