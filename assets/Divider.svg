<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="48" viewBox="0 0 1000 48" role="img" aria-label="liquid glass slider divider" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0A84FF"/><stop offset="0.5" stop-color="#BF5AF2"/><stop offset="1" stop-color="#FF375F"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/><stop offset="0.5" stop-color="#8E9BDA" stop-opacity="0.35"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/></linearGradient>
    <linearGradient id="knob" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4FF"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#BF5AF2" stop-opacity="0.6"/><stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/></radialGradient>
    <clipPath id="trackclip"><rect x="200" y="16" width="600" height="16" rx="8"/></clipPath>
  </defs>
  <circle cx="168" cy="24" r="3.2" fill="#8E9BDA" opacity="0.8"/>
  <circle cx="838" cy="24" r="5.5" fill="#8E9BDA" opacity="0.8"/>
  <rect x="200" y="16" width="600" height="16" rx="8" fill="#8E9BDA" fill-opacity="0.16"/>
  <g clip-path="url(#trackclip)">
    <rect x="200" y="16" width="60" height="16" fill="url(#prog)">
      <animate attributeName="width" values="60;480;200;520;60" keyTimes="0;0.3;0.5;0.8;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="200" y="16" width="600" height="16" rx="8" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="60 0;480 0;200 0;520 0;60 0" keyTimes="0;0.3;0.5;0.8;1" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1" dur="5s" repeatCount="indefinite"/>
    <circle cx="200" cy="24" r="22" fill="url(#glow)"/>
    <ellipse cx="200" cy="35" rx="13" ry="3.5" fill="#000" opacity="0.25"/>
    <circle cx="200" cy="24" r="13" fill="url(#knob)" stroke="url(#edge)" stroke-width="1.2"/>
    <path d="M192 20 A9 9 0 0 1 202 15.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>
