<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a5e"/><stop offset="1" stop-color="#0a0f24"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".05"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="220" rx="28" fill="url(#bg)"/>
<circle cx="140" cy="40" r="90" fill="#7cc4ff" opacity=".18"><animate attributeName="cx" values="140;260;140" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="190" r="100" fill="#a78bfa" opacity=".2"><animate attributeName="cx" values="760;640;760" dur="14s" repeatCount="indefinite"/></circle>
<rect x="1" y="1" width="898" height="218" rx="27" fill="url(#glass)" stroke="#fff" stroke-opacity=".25"/>
<path id="p" d="M90 110 H300 Q330 110 330 80 V70 Q330 50 350 50 H550 Q570 50 570 70 V150 Q570 170 590 170 H810" fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10" opacity=".7">
 <animate attributeName="stroke-dashoffset" from="0" to="-64" dur="2s" repeatCount="indefinite"/></path>
<g filter="url(#glow)" fill="#fff">
 <circle r="6"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
 <circle r="4" opacity=".8"><animateMotion dur="5s" begin="-1.7s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
 <circle r="3" opacity=".6"><animateMotion dur="5s" begin="-3.4s" repeatCount="indefinite"><mpath href="#p"/></animateMotion></circle>
</g>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eefc" text-anchor="middle">
 <g><circle cx="90" cy="110" r="24" fill="#7cc4ff" fill-opacity=".25" stroke="#7cc4ff"><animate attributeName="r" values="24;28;24" dur="3s" repeatCount="indefinite"/></circle><text x="90" y="156">Data</text></g>
 <g><circle cx="350" cy="50" r="24" fill="#a78bfa" fill-opacity=".25" stroke="#a78bfa"><animate attributeName="r" values="24;28;24" dur="3s" begin=".8s" repeatCount="indefinite"/></circle><text x="350" y="94">Analytics</text></g>
 <g><circle cx="570" cy="110" r="24" fill="#f0abfc" fill-opacity=".25" stroke="#f0abfc"><animate attributeName="r" values="24;28;24" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle><text x="570" y="26">CI/CD</text></g>
 <g><circle cx="810" cy="170" r="24" fill="#4ade80" fill-opacity=".25" stroke="#4ade80"><animate attributeName="r" values="24;28;24" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle><text x="810" y="136">Deployed</text></g>
</g>
</svg>
